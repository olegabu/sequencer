syntax = "proto2";

package sequencer.node.proto;

// brpc's classic "generic services" style (protobuf's own built-in,
// still-supported service codegen) — the pattern brpc's own examples
// and services use throughout, in preference to a gRPC-plugin style.
option cc_generic_services = true;

// specification.md §3, §5.2: a client-signed, opaque input. The
// sequencer never interprets these bytes — the client's signature is
// embedded inside `input` itself (§7).
message ProposeRequest {
  required bytes input = 1;
}

// specification.md §5.2: "committed at this position; will be
// deterministically processed; outcome per the designated output and
// the output stream." Deliberately absent: an input hash (§5.2 — a
// client verifies against its own retained bytes, never an echo) and a
// block identifier (derivable from sequence_number by the fixed block
// rule, §7.1).
message ProposeResponse {
  // Set when the input was committed and applied.
  optional uint64 sequence_number = 1;
  optional bytes designated_output = 2;

  // Set when this node is not the leader (specification.md §3:
  // "Propose(bytes) -> {...} | redirect(leader) | error"). The caller
  // should retry against leader_hint if non-empty.
  optional bool redirect = 3 [default = false];
  optional string leader_hint = 4;

  // Set on any other failure (for example: shutting down, or the
  // in-flight raft task was aborted by a leadership change).
  optional string error_message = 5;
}

// Several inputs in one RPC. This batches the *RPC*, not consensus —
// braft already batches internally (see raft-tests/braft's
// LEADER_BATCH) — and exists because an input gateway makes exactly
// one proposal per client request, so at 100k req/s it was making
// 100k RPCs/s to the leader. Profiling the gateway there found no
// application symbol near the top and a flat profile of socket
// syscalls, kernel spinlocks and thread wakeups; fewer, larger wire
// calls is the same fix that worked for gateway/relay and
// gateway/output.
//
// Each input is applied as its own raft task and gets its own
// sequence number, exactly as if it had arrived via Propose. Results
// are positional: results[i] belongs to inputs[i].
message ProposeBatchRequest {
  repeated bytes inputs = 1;
}

// One entry per input, in the same order. Per-input failure is
// possible in principle (a leadership change partway through a batch),
// so each carries its own error_message rather than failing the whole
// batch.
message ProposeResult {
  optional uint64 sequence_number = 1;
  optional bytes designated_output = 2;
  optional string error_message = 3;
}

message ProposeBatchResponse {
  repeated ProposeResult results = 1;

  // Batch-level redirect: the node was not the leader, so nothing in
  // the batch was applied and the caller should resend all of it.
  optional bool redirect = 2 [default = false];
  optional string leader_hint = 3;
}

service ProposeService {
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc ProposeBatch(ProposeBatchRequest) returns (ProposeBatchResponse);
}
