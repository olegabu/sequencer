name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # g++-10, not the runner's default: this codebase requires C++20
      # <span>, which predates GCC's default compiler on Ubuntu images
      # older than this — see README.md's Prerequisites for why.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-10

      # Lets vcpkg use GitHub Actions' own cache as a binary cache, so
      # only the first run (or a vcpkg.json change) pays for building
      # braft/brpc/thrift/abseil etc. from source.
      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Pinned to vcpkg.json's own builtin-baseline commit, not vcpkg's
      # moving HEAD. vcpkg.json pins *port* versions via that baseline,
      # but an unpinned vcpkg CLI checkout still pulls whatever tool
      # versions vcpkg's own scripts/vcpkg-tools.json currently
      # specifies (its bundled CMake, notably) — and those drift
      # independently of the baseline as vcpkg's own repo moves
      # forward. That drift broke every CI run so far: a newer bundled
      # CMake (4.4.0) hard-rejects a `-Werror=old-style-cast` argument
      # the old, baseline-pinned `benchmark` port (v1.9.1) passes it,
      # something older CMake versions tolerated. Checking out the
      # exact baseline commit keeps the whole toolchain — port
      # versions and the tool that builds them — reproducible together,
      # matching how local development here has worked all along
      # (nobody's local vcpkg checkout has ever been `git pull`ed past
      # this commit).
      - name: Bootstrap vcpkg
        run: |
          baseline=$(jq -r '.["builtin-baseline"]' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$baseline"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      # specification.md §11's determinism gate (tools/replay, via
      # examples/counter's CounterReplay test) runs as part of this
      # same suite — see docs/specification.md#11-determinism-certification.
      - name: Test
        run: ctest --preset debug --output-on-failure
